name: Daily scan

on:
  schedule:
    # Weekdays 22:35 UTC, after the US close (Canada and India are closed too).
    - cron: "35 22 * * 1-5"
  push:
    # runs once whenever the settings change (results commits don't touch this file)
    branches: [claude/i-connected-j88f6j]
    paths: [config.json]
  workflow_dispatch:
    inputs:
      skip_twelvedata:
        description: "Re-rank from cached US data only (no Twelve Data credits)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 170   # 780 US symbols at 8/minute is ~100 minutes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      - name: Scan
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY || secrets.TWELVE_DATA_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY || secrets.ALPHA_VANTAGE_KEY }}
        run: |
          if [ "${{ inputs.skip_twelvedata }}" = "true" ]; then
            python -m scanner.run --skip-twelvedata
          else
            python -m scanner.run
          fi

      - name: Commit results
        run: |
          git config user.name "scanner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Scan results $(date -u +%Y-%m-%d)"
            git push
          fi
